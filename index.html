<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditor Patrimonial</title>
    <!-- Tailwind CSS para Estilização Rápida e Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode para leitura de código de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SheetJS para exportação em Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { overscroll-behavior-y: contain; }
        input[type="file"] { display: none; }
        .step-container { transition: opacity 0.3s; }
        .disabled-step { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
            Auditor Patrimonial
        </h1>
        <!-- Indicador de Conexão -->
        <div id="connectionStatus" class="text-[10px] text-center mt-1 uppercase font-bold text-blue-200">Verificando Conexão...</div>
    </header>

    <main class="flex-1 p-4 w-full max-w-md mx-auto space-y-6">
        
        <!-- ETAPA 1: Local -->
        <section id="step1" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 step-container">
            <h2 class="text-lg font-semibold mb-3 text-slate-700 border-b pb-2">Etapa 1: Definir Local</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nome do Local</label>
                    <input type="text" id="locationInput" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Sala 101, Galpão B">
                </div>
                <button onclick="lockLocation()" id="btnLockLocation" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors">
                    Iniciar Auditoria neste Local
                </button>
            </div>
            <div id="currentLocationDisplay" class="hidden mt-3 p-3 bg-blue-50 text-blue-800 rounded-lg flex justify-between items-center border border-blue-100">
                <span class="font-bold" id="locationLabel"></span>
                <button onclick="unlockLocation()" class="text-sm text-blue-600 underline">Alterar</button>
            </div>
        </section>

        <div id="actionSteps" class="space-y-6 disabled-step">
            
            <!-- ETAPA 2: Patrimônio Existente (Com Plaqueta) -->
            <section id="step2" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-3 text-emerald-700 border-b pb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>
                    Etapa 2: Bem COM Plaqueta
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nº da Plaqueta</label>
                        <div class="flex gap-2">
                            <input type="text" id="plaqueInput" class="flex-1 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Digite ou escaneie">
                            <button onclick="startScanner()" class="bg-slate-800 text-white p-3 rounded-lg flex items-center justify-center w-14 active:bg-slate-700">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Câmera Scanner Modal -->
                    <div id="reader-container" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col justify-center items-center">
                        <div class="p-4 flex justify-between items-center absolute top-0 w-full z-50 bg-black/50 text-white">
                            <span class="font-bold">Aponte para o Código</span>
                            <button onclick="stopScanner()" class="bg-red-600 px-3 py-1 rounded text-white font-bold">Fechar</button>
                        </div>
                        <div id="reader" class="w-full max-w-sm bg-white"></div>
                    </div>

                    <div class="pt-2">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Foto do Número de Série</label>
                        <label for="serialPhoto" class="w-full bg-slate-100 border-2 border-dashed border-slate-300 text-slate-600 font-semibold py-4 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                            <span id="photoStatus">Capturar Foto</span>
                        </label>
                        <input type="file" id="serialPhoto" accept="image/*" capture="environment" onchange="processPhoto('serialPhoto', 'photoStatus', 'downloadPhotoContainer', 2)">
                        <div id="downloadPhotoContainer" class="hidden text-center mt-3"></div>
                    </div>

                    <button onclick="saveAssetExistente()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg mt-4 shadow-md">
                        Salvar Bem Existente
                    </button>
                </div>
            </section>

            <!-- Separador Visual -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-300"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-sm font-bold uppercase">Ou</span>
                <div class="flex-grow border-t border-slate-300"></div>
            </div>

            <!-- ETAPA 3: Patrimônio Novo (Sem Plaqueta) -->
            <section id="step3" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold mb-3 text-blue-700 border-b pb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    Etapa 3: Bem SEM Plaqueta (Novo)
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Código do Patrimônio <span class="text-red-500">*</span></label>
                        <input type="text" id="newCodeInput" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Obrigatório">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nome Completo <span class="text-red-500">*</span></label>
                        <input type="text" id="newNameInput" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Obrigatório">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Número de Série <span class="text-slate-400 text-xs font-normal">(Opcional)</span></label>
                        <input type="text" id="newSerialInput" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Opcional">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Marca / Modelo <span class="text-slate-400 text-xs font-normal">(Opcional)</span></label>
                        <input type="text" id="newBrandInput" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Opcional">
                    </div>

                    <div class="pt-2">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Foto do Bem <span class="text-slate-400 text-xs font-normal">(Opcional)</span></label>
                        <label for="photoExtra" class="w-full bg-slate-100 border-2 border-dashed border-slate-300 text-slate-600 font-semibold py-4 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                            <span id="photoStatusExtra">Capturar Foto</span>
                        </label>
                        <input type="file" id="photoExtra" accept="image/*" capture="environment" onchange="processPhoto('photoExtra', 'photoStatusExtra', 'downloadPhotoContainerExtra', 3)">
                        <div id="downloadPhotoContainerExtra" class="hidden text-center mt-3"></div>
                    </div>

                    <button onclick="saveAssetNovo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 shadow-md">
                        Salvar Bem Extra
                    </button>
                </div>
            </section>

            <!-- ETAPA 4: Resumo e Exportação -->
            <section id="step4" class="bg-slate-900 text-white p-5 rounded-xl shadow-sm border border-slate-700 mb-6">
                <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-2">
                    <h2 class="text-lg font-semibold">Etapa 4: Resumo e Envio</h2>
                    <span id="totalItems" class="bg-slate-700 text-white text-xs font-bold px-2 py-1 rounded-full">0 itens na memória</span>
                </div>
                
                <ul id="assetList" class="space-y-2 mb-4 max-h-40 overflow-y-auto text-sm">
                    <li class="italic text-slate-400 text-center py-2">Nenhum registro no local atual.</li>
                </ul>

                <div class="grid grid-cols-1 gap-3 mt-4">
                    <button id="syncBtn" onclick="syncWithGoogle()" class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-slate-600 disabled:text-slate-400 font-semibold py-4 rounded-lg text-base flex justify-center items-center gap-2 shadow-lg transition-all">
                        <span>☁️ Sincronizar Tudo com o Google</span>
                    </button>

                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <button onclick="finishLocation()" class="bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg text-sm">
                            Mudar Local
                        </button>
                        <button onclick="exportToExcel()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-lg text-sm flex justify-center items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Exportar Excel
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- Botão de Segurança -->
            <div class="text-center pb-10">
                <button onclick="recoverBackup()" class="text-xs text-slate-500 underline hover:text-slate-700">⚠ Restaurar último backup local (Anti-falha)</button>
            </div>

        </div>
    </main>

    <!-- Canvas Oculto para compressão de imagens -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <!-- Notificações Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm transition-opacity opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMessage">Mensagem</span>
    </div>

    <script>
        // CONFIGURAÇÃO DO GOOGLE SHEETS - MANTIVE O SEU LINK
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvEvKleaB_4ecJ86K8FO-9_zLtuVrdL6qkau8nuYKnNGz5Nu3W7VFczUrfenv4EMX2FA/exec";

        // --- Estado da Aplicação e Armazenamento Local ---
        let assetsDatabase = JSON.parse(localStorage.getItem('audit_db')) || [];
        let currentLoc = "";
        let html5QrcodeScanner = null;
        let photoDataStep2 = null;
        let photoDataStep3 = null;

        // --- Funções de UI (Toast e Online/Offline) ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.style.opacity = '1';
            
            if(type === 'error') {
                toast.classList.replace('bg-slate-900', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-slate-900');
            }

            setTimeout(() => toast.style.opacity = '0', 3500);
        }

        function updateOnlineStatus() {
            const status = document.getElementById('connectionStatus');
            const syncBtn = document.getElementById('syncBtn');
            if (navigator.onLine) {
                status.innerText = "Conectado (WiFi/Dados)";
                status.className = "text-[10px] text-center mt-1 uppercase font-bold text-emerald-400";
                if(syncBtn) syncBtn.disabled = false;
            } else {
                status.innerText = "Offline (Sincronismo Pausado)";
                status.className = "text-[10px] text-center mt-1 uppercase font-bold text-red-400";
                if(syncBtn) syncBtn.disabled = true;
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // --- Gestão de Local (Etapa 1) ---
        function lockLocation() {
            const locInput = document.getElementById('locationInput').value.trim();
            if (!locInput) return showToast("Por favor, informe o nome do local.", "error");
            
            currentLoc = locInput;
            document.getElementById('locationInput').style.display = 'none';
            document.getElementById('btnLockLocation').style.display = 'none';
            document.getElementById('currentLocationDisplay').classList.remove('hidden');
            document.getElementById('locationLabel').textContent = currentLoc;
            document.getElementById('actionSteps').classList.remove('disabled-step');
            
            updateAssetList();
            showToast(`Auditoria iniciada: ${currentLoc}`);
        }

        function unlockLocation() {
            currentLoc = "";
            document.getElementById('locationInput').style.display = 'block';
            document.getElementById('btnLockLocation').style.display = 'block';
            document.getElementById('currentLocationDisplay').classList.add('hidden');
            document.getElementById('locationInput').value = '';
            document.getElementById('actionSteps').classList.add('disabled-step');
        }

        function finishLocation() {
            if (confirm("Encerrar este local e ir para o próximo?")) {
                unlockLocation();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // --- Câmera e Scanner (html5-qrcode) ---
        function startScanner() {
            document.getElementById('reader-container').classList.remove('hidden');
            if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");

            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, () => {})
            .catch(err => {
                html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess, () => {})
                .catch(err2 => {
                    showToast("Erro ao abrir câmera.", "error");
                    stopScanner();
                });
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                }).catch(err => console.error(err));
            } else {
                document.getElementById('reader-container').classList.add('hidden');
            }
        }

        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate(200);
            document.getElementById('plaqueInput').value = decodedText;
            showToast("Código lido!");
            stopScanner();
        }

        // --- Processamento de Foto (Compressão Otimizada) ---
        function processPhoto(inputId, statusId, containerId, step) {
            const input = document.getElementById(inputId);
            const statusLabel = document.getElementById(statusId);
            const downloadContainer = document.getElementById(containerId);
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('compressCanvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Redimensiona para max 800px de largura
                        const scale = 800 / img.width;
                        canvas.width = 800;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // Comprime para 60%
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        if (step === 2) photoDataStep2 = compressedData;
                        if (step === 3) photoDataStep3 = compressedData;

                        statusLabel.textContent = `Foto salva e otimizada ✓`;
                        statusLabel.parentElement.classList.replace('bg-slate-100', 'bg-emerald-50');
                        statusLabel.parentElement.classList.replace('border-slate-300', 'border-emerald-400');
                        statusLabel.parentElement.classList.replace('text-slate-600', 'text-emerald-700');

                        // Prepara o botão de salvar na galeria
                        downloadContainer.innerHTML = `<a href="${compressedData}" download="Patrimonio_${Date.now()}.jpg" class="inline-flex items-center gap-2 bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-lg font-bold shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Salvar Foto no Aparelho
                        </a>`;
                        downloadContainer.classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function resetPhotoField(inputId, statusId, containerId, step) {
            if (step === 2) photoDataStep2 = null;
            if (step === 3) photoDataStep3 = null;

            const input = document.getElementById(inputId);
            const statusLabel = document.getElementById(statusId);
            const downloadContainer = document.getElementById(containerId);
            
            input.value = ""; 
            statusLabel.textContent = "Capturar Foto";
            statusLabel.parentElement.classList.replace('bg-emerald-50', 'bg-slate-100');
            statusLabel.parentElement.classList.replace('border-emerald-400', 'border-slate-300');
            statusLabel.parentElement.classList.replace('text-emerald-700', 'text-slate-600');
            
            if(downloadContainer) {
                downloadContainer.innerHTML = '';
                downloadContainer.classList.add('hidden');
            }
        }

        // --- Lógica de Negócio (Salvar no Banco Local) ---
        function saveAssetExistente() {
            const plaque = document.getElementById('plaqueInput').value.trim();
            if (!plaque) return showToast("Informe o Nº da Plaqueta.", "error");

            const now = new Date();
            const asset = {
                Local: currentLoc,
                Tipo: "Com Plaqueta",
                Plaqueta: plaque,
                FotoRegistrada: photoDataStep2 ? "Sim" : "Não",
                Nome: "-", NumeroSerie: "-", Marca: "-",
                Data: now.toLocaleDateString('pt-BR'),
                Hora: now.toLocaleTimeString('pt-BR')
            };

            assetsDatabase.push(asset);
            localStorage.setItem('audit_db', JSON.stringify(assetsDatabase)); 
            
            document.getElementById('plaqueInput').value = '';
            resetPhotoField('serialPhoto', 'photoStatus', 'downloadPhotoContainer', 2);
            updateAssetList();
            showToast("Bem Existente Salvo!");
        }

        function saveAssetNovo() {
            const code = document.getElementById('newCodeInput').value.trim();
            const name = document.getElementById('newNameInput').value.trim();
            const serie = document.getElementById('newSerialInput').value.trim() || "-";
            const brand = document.getElementById('newBrandInput').value.trim() || "-";

            if (!code || !name) return showToast("Preencha Código do Patrimônio e Nome Completo.", "error");

            const now = new Date();
            const asset = {
                Local: currentLoc,
                Tipo: "Novo/Extra",
                Plaqueta: code,
                FotoRegistrada: photoDataStep3 ? "Sim" : "Não",
                Nome: name,
                NumeroSerie: serie,
                Marca: brand,
                Data: now.toLocaleDateString('pt-BR'),
                Hora: now.toLocaleTimeString('pt-BR')
            };

            assetsDatabase.push(asset);
            localStorage.setItem('audit_db', JSON.stringify(assetsDatabase)); 
            
            document.getElementById('newCodeInput').value = '';
            document.getElementById('newNameInput').value = '';
            document.getElementById('newSerialInput').value = '';
            document.getElementById('newBrandInput').value = '';
            resetPhotoField('photoExtra', 'photoStatusExtra', 'downloadPhotoContainerExtra', 3);
            
            updateAssetList();
            showToast("Bem Extra Salvo!");
        }

        // --- Etapa 4: Resumo, Sincronização e Excel ---
        function updateAssetList() {
            const list = document.getElementById('assetList');
            const countLocal = document.getElementById('totalItems');
            
            countLocal.textContent = `${assetsDatabase.length} itens guardados na memória`;
            
            const currentLocAssets = assetsDatabase.filter(a => a.Local === currentLoc).reverse();
            
            if (currentLocAssets.length === 0) {
                list.innerHTML = '<li class="italic text-slate-400 text-center py-2">Nenhum registro no local atual.</li>';
                return;
            }

            list.innerHTML = '';
            currentLocAssets.forEach(item => {
                const li = document.createElement('li');
                const isNovo = item.Tipo === "Novo/Extra";
                li.className = "bg-slate-800 p-2 rounded border border-slate-700 flex flex-col gap-1";
                
                if (isNovo) {
                    li.innerHTML = `
                        <div class="flex justify-between text-blue-400 font-bold">
                            <span>EXTRA</span>
                            <span class="text-xs text-slate-400 font-normal">Foto: ${item.FotoRegistrada}</span>
                        </div>
                        <span class="text-white">Nº ${item.Plaqueta} - ${item.Nome}</span>
                        ${item.NumeroSerie !== '-' || item.Marca !== '-' ? `<span class="text-xs text-slate-500 mt-1 block">Série: ${item.NumeroSerie} | Marca: ${item.Marca}</span>` : ''}
                    `;
                } else {
                    li.innerHTML = `
                        <div class="flex justify-between text-emerald-400 font-bold">
                            <span>PLAQUETA</span>
                            <span class="text-xs text-slate-400 font-normal">Foto: ${item.FotoRegistrada}</span>
                        </div>
                        <span class="text-white">Nº ${item.Plaqueta}</span>
                    `;
                }
                list.appendChild(li);
            });
        }

        updateAssetList();

        // --- TRAVA DE SEGURANÇA E BACKUP (Recuperação de dados) ---
        function recoverBackup() {
            const backup = localStorage.getItem('audit_backup');
            if (backup && JSON.parse(backup).length > 0) {
                assetsDatabase = JSON.parse(backup);
                localStorage.setItem('audit_db', backup);
                updateAssetList();
                showToast("Dados recuperados do último backup de segurança!", "success");
            } else {
                showToast("Não há dados antigos salvos para recuperar.", "error");
            }
        }

        async function syncWithGoogle() {
            if(assetsDatabase.length === 0) return showToast("Não há itens na memória para sincronizar.", "error");

            const btn = document.getElementById('syncBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Sincronizando com a Nuvem...";
            btn.disabled = true;

            try {
                // ENVIO CORRIGIDO: Restaurando o modo 'no-cors' para evitar o bloqueio de segurança do navegador (CORS).
                // Como as permissões do Google estão agora corretas, a comunicação fluirá.
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(assetsDatabase)
                });

                showToast("Dados enviados para o Google Sheets com sucesso!");
                
                // BACKUP SALVA-VIDAS: Antes de apagar, fazemos uma cópia de segurança na memória do telemóvel
                localStorage.setItem('audit_backup', JSON.stringify(assetsDatabase));

                // Esvazia o banco de dados principal local
                assetsDatabase = []; 
                localStorage.setItem('audit_db', JSON.stringify(assetsDatabase));
                updateAssetList();
                
            } catch (error) {
                console.error(error);
                showToast("Erro ao sincronizar.", "error");
                // MENSAGEM NOVA PARA COMPROVAR ATUALIZAÇÃO
                alert("AVISO DE SISTEMA (Versão Atualizada):\n\nFalha de Comunicação!\nOs seus dados continuam guardados em segurança no telemóvel.\n\nVerifique a sua ligação à internet ou as permissões do Google Apps Script.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function exportToExcel() {
            if (assetsDatabase.length === 0) return showToast("Não há dados para exportar.", "error");

            try {
                const wb = XLSX.utils.book_new();
                const dadosMapeados = assetsDatabase.map(a => ({
                    "Local": a.Local,
                    "Tipo de Cadastro": a.Tipo,
                    "Plaqueta": a.Plaqueta,
                    "Foto do N.Série": a.FotoRegistrada,
                    "Nome do Item (Extra)": a.Nome,
                    "Número de Série (Extra)": a.NumeroSerie,
                    "Marca/Modelo (Extra)": a.Marca,
                    "Data": a.Data,
                    "Hora": a.Hora
                }));

                const ws = XLSX.utils.json_to_sheet(dadosMapeados);
                ws['!cols'] = [{wch: 15}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 25}, {wch: 20}, {wch: 20}, {wch: 15}, {wch: 12}];

                XLSX.utils.book_append_sheet(wb, ws, "Auditoria");
                XLSX.writeFile(wb, `Auditoria_Backup_${new Date().getTime()}.xlsx`);
                
                showToast("Excel exportado!");
            } catch (err) {
                console.error(err);
                showToast("Erro ao exportar Excel.", "error");
            }
        }
    </script>
</body>
