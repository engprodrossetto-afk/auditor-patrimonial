<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditor Pro - Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { overscroll-behavior-y: contain; }
        input[type="file"] { display: none; }
        .disabled-step { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center">Auditor Patrimonial</h1>
        <div id="connectionStatus" class="text-[10px] text-center mt-1 uppercase font-bold text-blue-200">Verificando Conexão...</div>
    </header>

    <main class="flex-1 p-4 w-full max-w-md mx-auto space-y-6">
        <section id="step1" class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">1. Local</h2>
            <div class="flex gap-2">
                <input type="text" id="locationInput" class="w-full p-3 border rounded-lg" placeholder="Ex: Almoxarifado">
                <button onclick="lockLocation()" id="btnLock" class="bg-blue-600 text-white px-4 rounded-lg font-bold">OK</button>
            </div>
            <div id="locDisplay" class="hidden mt-3 p-3 bg-blue-50 text-blue-800 rounded-lg flex justify-between items-center">
                <span id="locLabel" class="font-bold"></span>
                <button onclick="unlockLocation()" class="text-xs underline text-blue-600">Trocar</button>
            </div>
        </section>

        <div id="actionSteps" class="space-y-6 disabled-step">
            <section class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
                <h2 class="text-lg font-semibold mb-4 text-emerald-700 border-b pb-2">Captura Rápida</h2>
                
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Nº PLAQUETA / CÓDIGO</label>
                    <div class="flex gap-2">
                        <input type="text" id="idInput" class="flex-1 p-3 border rounded-lg bg-slate-50" placeholder="Aperte 📷 para ler">
                        <button onclick="startScanner()" class="bg-slate-800 text-white p-3 rounded-lg">📷</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="cameraInput" class="w-full bg-slate-100 border-2 border-dashed border-slate-300 text-slate-500 py-6 rounded-lg flex flex-col items-center justify-center cursor-pointer active:bg-slate-200">
                        <span id="camLabel" class="font-bold">Tirar Foto (Baixa Res)</span>
                    </label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processPhoto()">
                    <div id="photoPreviewArea" class="hidden mt-2 text-center">
                        <canvas id="compressCanvas" class="hidden"></canvas>
                        <a id="downloadLink" class="inline-block bg-emerald-100 text-emerald-700 px-4 py-2 rounded-lg text-xs font-bold border border-emerald-200">✓ Salvar Foto na Galeria</a>
                    </div>
                </div>

                <button onclick="saveItem()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg">Gravar Patrimônio</button>
            </section>

            <section class="bg-slate-900 text-white p-5 rounded-xl shadow-md mb-20">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Sincronização</h2>
                    <span id="countLabel" class="bg-blue-600 px-2 py-1 rounded text-xs">0 itens pendentes</span>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <button id="syncBtn" onclick="syncWithGoogle()" class="bg-blue-500 disabled:bg-slate-700 py-4 rounded-lg font-bold flex items-center justify-center gap-2">
                        <span>☁️ Sincronizar com WiFi</span>
                    </button>
                    <button onclick="exportExcel()" class="bg-slate-700 py-2 rounded-lg text-xs">Exportar Backup Excel</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        // CONFIGURAÇÃO: COLE SUA URL DO APPS SCRIPT AQUI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvEvKleaB_4ecJ86K8FO-9_zLtuVrdL6qkau8nuYKnNGz5Nu3W7VFczUrfenv4EMX2FA/exec";

        let db = JSON.parse(localStorage.getItem('audit_db')) || [];
        let currentLoc = "";
        let compressedPhotoData = null;

        // --- Gerenciamento de Rede ---
        function updateOnlineStatus() {
            const status = document.getElementById('connectionStatus');
            const syncBtn = document.getElementById('syncBtn');
            if (navigator.onLine) {
                status.innerText = "Conectado (WiFi/Dados)";
                status.className = "text-[10px] text-center mt-1 uppercase font-bold text-emerald-400";
                syncBtn.disabled = false;
            } else {
                status.innerText = "Offline (Sincronismo Pausado)";
                status.className = "text-[10px] text-center mt-1 uppercase font-bold text-red-400";
                syncBtn.disabled = true;
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // --- Processamento de Imagem (Performance) ---
        function processPhoto() {
            const file = document.getElementById('cameraInput').files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Redimensionamento Otimizado (Max 800px)
                    const scale = 800 / img.width;
                    canvas.width = 800;
                    canvas.height = img.height * scale;
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Comprime para 60% de qualidade
                    compressedPhotoData = canvas.toDataURL('image/jpeg', 0.6);
                    
                    // Prepara o link de download para galeria
                    const link = document.getElementById('downloadLink');
                    link.href = compressedPhotoData;
                    link.download = `Patr_${Date.now()}.jpg`;
                    
                    document.getElementById('photoPreviewArea').classList.remove('hidden');
                    document.getElementById('camLabel').innerText = "Foto Processada!";
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- Lógica do App ---
        function lockLocation() {
            currentLoc = document.getElementById('locationInput').value;
            if(!currentLoc) return alert("Digite o local");
            document.getElementById('locationInput').classList.add('hidden');
            document.getElementById('btnLock').classList.add('hidden');
            document.getElementById('locDisplay').classList.remove('hidden');
            document.getElementById('locLabel').innerText = currentLoc;
            document.getElementById('actionSteps').classList.remove('disabled-step');
        }

        function unlockLocation() {
            document.getElementById('locationInput').classList.remove('hidden');
            document.getElementById('btnLock').classList.remove('hidden');
            document.getElementById('locDisplay').classList.add('hidden');
            document.getElementById('actionSteps').classList.add('disabled-step');
        }

        function saveItem() {
            const id = document.getElementById('idInput').value;
            if(!id) return alert("Falta o código/plaqueta");

            const item = {
                Local: currentLoc,
                Tipo: "Captura",
                Plaqueta: id,
                FotoRegistrada: compressedPhotoData ? "Sim" : "Não",
                Nome: "-", NumeroSerie: "-", Marca: "-",
                Data: new Date().toLocaleDateString(),
                Hora: new Date().toLocaleTimeString()
            };

            db.push(item);
            localStorage.setItem('audit_db', JSON.stringify(db));
            
            // Limpar Campos
            document.getElementById('idInput').value = "";
            document.getElementById('photoPreviewArea').classList.add('hidden');
            compressedPhotoData = null;
            document.getElementById('camLabel').innerText = "Tirar Foto (Baixa Res)";
            
            updateCount();
            alert("Item Gravado Localmente!");
        }

        function updateCount() {
            document.getElementById('countLabel').innerText = `${db.length} itens pendentes`;
        }
        updateCount();

        // --- SINCRONIZAÇÃO GOOGLE SHEETS ---
        async function syncWithGoogle() {
            if(db.length === 0) return alert("Nada para sincronizar");
            if(SCRIPT_URL.includes("COLE_AQUI")) return alert("Configure a URL do Apps Script primeiro!");

            const btn = document.getElementById('syncBtn');
            btn.innerText = "⏳ Sincronizando...";
            btn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Necessário para Google Apps Script
                    cache: 'no-cache',
                    body: JSON.stringify(db)
                });

                // Como usamos no-cors, o fetch não retorna sucesso explícito, 
                // mas se não der erro de rede, assumimos o envio.
                alert("Dados enviados para o Google Sheets!");
                db = []; // Limpa banco local após sucesso
                localStorage.setItem('audit_db', JSON.stringify(db));
                updateCount();
            } catch (error) {
                console.error(error);
                alert("Erro ao sincronizar. Verifique o WiFi.");
            } finally {
                btn.innerText = "☁️ Sincronizar com WiFi";
                btn.disabled = false;
            }
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(db);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Auditoria");
            XLSX.writeFile(wb, `Backup_Auditoria_${Date.now()}.xlsx`);
        }

        // Scanner Logic (Simplificado para o exemplo)
        function startScanner() {
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            alert("Scanner iniciado! (Requer HTTPS)");
        }
    </script>
</body>
</html>
